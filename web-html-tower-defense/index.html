    VW / 2, y + 62, 8.5, PAL.boneDim, 'center');

  // 数据
  const rows = [
    [['击杀', `${over.kills}`], ['剩余生命', `${over.lives}`], ['建成塔', `${over.towers}`]],
    [['AI 决策', `${over.aiActions}`], ['用时', fmtTime(over.time)], ['总收入', `${over.earned}`]],
  ];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < 3; c++) {
      const cellX = x + 34 + c * 124;
      const cellY = y + 92 + r * 38;
      drawText(rows[r][c][0], cellX, cellY, 7, PAL.muted);
      drawText(rows[r][c][1], cellX, cellY + 14, 13, r === 0 && c === 1 && over.win ? PAL.emberHi : PAL.bone, 'left', 'bold', true);
    }
  }
  drawText(g.ai ? 'AI 全程托管 · 未使用额外金币或冷却' : (over.aiActions > 0 ? '玩家接管 · AI 曾参与指挥' : '手动指挥完成'),
    VW / 2, y + 172, 7.5, g.ai ? PAL.green : PAL.muted, 'center');

  // 按钮
  button('overRestart', x + 20, y + 190, 124, 28, '再来一局', () => restartRun(), { primary: true, size: 9 });
  button('overSwitch', x + 154, y + 190, 124, 28, '换张地图', () => switchMapInGame(), { size: 9 });
  button('overMenu', x + 288, y + 190, 124, 28, '返回菜单', () => backToMenu(), { size: 9 });
  drawText('R 重开 · M 换图 · 全部规则对 AI 与玩家一致', VW / 2, y + 228, 6.5, PAL.dim, 'center');
  ctx.globalAlpha = 1;
  // 结算覆盖 HUD，吞掉底层点击
  ui.hits = [];
  addHit('overBlock', 0, 0, VW, VH, null);
  // 重新登记结算按钮的点击区（上面 button 已写入旧数组，故手动补登记）
  const btnDefs = [
    ['overRestart', x + 20, y + 190, 124, 28, () => restartRun()],
    ['overSwitch', x + 154, y + 190, 124, 28, () => switchMapInGame()],
    ['overMenu', x + 288, y + 190, 124, 28, () => backToMenu()],
  ];
  for (const b of btnDefs) addHit(b[0], b[1], b[2], b[3], b[4], b[5]);
}

// ---------- 过渡 ----------
function drawTransition() {
  if (!transition.active || !transition.old) return;
  const p = clamp(transition.t / transition.dur, 0, 1);
  const block = 4;
  for (let by = 0; by < VH; by += block) {
    for (let bx = 0; bx < VW; bx += block) {
      const th = bayer8((bx / block) & 7, (by / block) & 7);
      if (th > p) {
        ctx.drawImage(transition.old, bx, by, block, block, bx, by, block, block);
      }
    }
  }
  // 前沿微光
  ctx.globalAlpha = Math.sin(p * Math.PI) * 0.08;
  ctx.fillStyle = PAL.emberHi;
  ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = 1;
}

// ---------- 渲染入口 ----------
function render() {
  ui.hits.length = 0;
  ui.cursor = 'default';
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (scene === 'menu') {
    renderMenu();
  } else if (game) {
    drawWorld();
    drawFieldHud();
    drawTopBar();
    renderSidePanel();
    if (scene === 'paused') drawPauseOverlay();
    if (scene === 'over') drawGameOverOverlay();
  }
  drawTransition();
  ctx.restore();

  if ((scene === 'playing' || scene === 'paused') && pointer.inside &&
      pointer.x < FIELD_W && pointer.y >= GY && ui.cursor === 'default') {
    ui.cursor = 'crosshair';
  }
  if (canvas.style.cursor !== ui.cursor) canvas.style.cursor = ui.cursor;
}
// ============================================================
//  交互：鼠标 / 键盘 / UI 动作
// ============================================================
function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - r.left) * VW / r.width;
  pointer.y = (e.clientY - r.top) * VH / r.height;
  pointer.inside = pointer.x >= 0 && pointer.x <= VW && pointer.y >= 0 && pointer.y <= VH;
}
canvas.addEventListener('pointermove', updatePointer);
canvas.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  e.preventDefault();
  updatePointer(e);
  handleClick();
});
canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (transition.active) return;
  if (buildType || selectedTower) {
    buildType = null;
    selectedTower = null;
  }
});
window.addEventListener('blur', () => { pointer.inside = false; });

function handleClick() {
  if (transition.active) return;
  for (let i = ui.hits.length - 1; i >= 0; i--) {
    const h = ui.hits[i];
    if (!h.disabled && pointer.x >= h.x && pointer.x < h.x + h.w &&
        pointer.y >= h.y && pointer.y < h.y + h.h) {
      if (h.fn) h.fn();
      return;
    }
  }
  if (scene !== 'playing' && scene !== 'paused') return;
  if (!game) return;
  if (pointer.x < 0 || pointer.x >= FIELD_W || pointer.y < GY) return;
  const cell = cellFromPoint(pointer.x, pointer.y);
  if (!cell) return;
  const tower = towerAtCell(cell.cx, cell.cy);
  if (tower) {
    selectedTower = tower;
    buildType = null;
    return;
  }
  if (buildType) {
    if (!isBuildableCell(cell.cx, cell.cy)) {
      setToast('这里不能建造', '请选择路径旁的草地');
      return;
    }
    if (game.gold < TOWERS[buildType].cost) {
      setToast('金币不足', `还差 ${Math.ceil(TOWERS[buildType].cost - game.gold)} 金`);
      return;
    }
    tryBuild(buildType, cell.cx, cell.cy, false, '手动布防');
    return;
  }
  selectedTower = null;
}

function chooseMap(id) {
  if (transition.active || !MAPS[id]) return;
  if (selectedMap === id) return;
  beginTransition(() => {
    selectedMap = id;
  });
}
function startManual() {
  if (transition.active) return;
  const mapId = selectedMap;
  beginTransition(() => {
    startGameInternal(mapId, false, 1);
  });
}
function startWatchAI() {
  if (transition.active) return;
  const mapId = selectedMap;
  beginTransition(() => {
    startGameInternal(mapId, true, 2);
  });
}
function pickTower(type) {
  if (scene !== 'playing' && scene !== 'paused') return;
  if (buildType === type) {
    buildType = null;
  } else {
    buildType = type;
    selectedTower = null;
  }
}
function clearBuild() {
  buildType = null;
}
function togglePause(force) {
  if (!game || transition.active || scene === 'menu' || scene === 'over') return;
  const shouldPause = force == null ? scene === 'playing' : !!force;
  if (shouldPause) {
    scene = 'paused';
  } else if (scene === 'paused') {
    scene = 'playing';
    loopAccum = 0;
  }
}
function cycleSpeed() {
  if (!game || scene === 'menu' || scene === 'over') return;
  gameSpeed = gameSpeed % 3 + 1;
  game.speed = gameSpeed;
}
function setSpeed(n) {
  if (!game) return;
  gameSpeed = clamp(Math.round(n), 1, 3);
  game.speed = gameSpeed;
}
function toggleAI(force) {
  if (!game || scene === 'menu' || scene === 'over') return;
  const next = force == null ? !aiOn : !!force;
  if (next === aiOn) return;
  aiOn = next;
  game.ai = next;
  game.aiTimer = 0.15;
  aiLog('info', next ? 'AI 接管 · 自动决策开启' : 'AI 退居观察 · 玩家指挥', next ? 'system' : 'user');
  setToast(next ? 'AI 接管' : '已切换手动',
    next ? 'AI 将自动建造 / 升级 / 技能' : '按 A 可随时交还 AI');
}
function restartRun() {
  if (transition.active) return;
  const mapId = game ? game.mapId : selectedMap;
  const ai = game ? aiOn : false;
  beginTransition(() => {
    startGameInternal(mapId, ai, gameSpeed);
  });
}
function switchMapInGame() {
  if (transition.active) return;
  const cur = game ? game.mapId : selectedMap;
  const next = cur === 'ashen' ? 'frost' : 'ashen';
  const ai = game ? aiOn : false;
  beginTransition(() => {
    startGameInternal(next, ai, gameSpeed);
  });
}
function backToMenu() {
  if (transition.active) return;
  const lastMap = game ? game.mapId : selectedMap;
  beginTransition(() => {
    selectedMap = lastMap;
    game = null;
    scene = 'menu';
    aiOn = false;
    gameSpeed = 1;
    buildType = null;
    selectedTower = null;
    ui.hoverShop = null;
  });
}

window.addEventListener('keydown', e => {
  if (transition.active) return;
  const key = e.key.toLowerCase();
  if ([' ', 'tab', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(key)) e.preventDefault();

  if (scene === 'menu') {
    if (key === 'enter') { startManual(); return; }
    if (key === 'w') { startWatchAI(); return; }
    if (key === 'arrowleft' || key === 'a') { chooseMap('ashen'); return; }
    if (key === 'arrowright' || key === 'd') { chooseMap('frost'); return; }
    return;
  }
  if (scene === 'over') {
    if (key === 'r' || key === 'enter') { restartRun(); return; }
    if (key === 'm') { switchMapInGame(); return; }
    if (key === 'escape') { backToMenu(); return; }
    return;
  }
  if (!game) return;
  if (key === ' ') { togglePause(); return; }
  if (key === 'p') { togglePause(); return; }
  if (key === 'escape') {
    if (buildType || selectedTower) {
      buildType = null;
      selectedTower = null;
    } else {
      togglePause();
    }
    return;
  }
  if (key === '1') { pickTower('bolt'); return; }
  if (key === '2') { pickTower('flame'); return; }
  if (key === '3') { pickTower('frost'); return; }
  if (key === '4') { pickTower('mint'); return; }
  if (key === 'u' || key === 'e') {
    if (selectedTower) tryUpgrade(selectedTower, false, '手动强化');
    return;
  }
  if (key === 's' || key === 'x') {
    if (selectedTower) trySell(selectedTower);
    return;
  }
  if (key === 'a') { toggleAI(); return; }
  if (key === 'f' || key === 'tab') { cycleSpeed(); return; }
  if (key === 'q') { castSkill(false); return; }
  if (key === 'r') { restartRun(); return; }
  if (key === 'm') { switchMapInGame(); return; }
});

// ============================================================
//  自动测试 / 公共 API / 主循环
// ============================================================
function finalizeAutotest(win, timeout = false) {
  if (!autotest || autotest.done) return;
  const g = game;
  autotest.done = true;
  autotest.win = !!win;
  autotest.timeout = !!timeout;
  autotest.simTime = g ? +g.t.toFixed(2) : 0;
  autotest.wallMs = Math.round(performance.now() - autotest.startedAt);
  autotest.fps = Math.round(fpsValue);
  autotest.map = g ? g.mapId : autotest.map;
  autotest.wave = g ? g.wave : 0;
  autotest.lives = g ? g.lives : 0;
  autotest.kills = g ? g.kills : 0;
  autotest.gold = g ? Math.floor(g.gold) : 0;
  autotest.aiActions = g ? g.aiActions : 0;
  autotest.aiOn = aiOn;
  autotest.cheats = false;
  autotest.towers = g ? g.towers.map(t => ({ type: t.type, level: t.level, cx: t.cx, cy: t.cy })) : [];
  autotest.logs = g ? g.aiLogs.slice(-12) : [];
  autotest.result = g && g.over ? { ...g.over } : null;
  window.__AUTOTEST__ = autotest;
  console.log('[autotest]', JSON.stringify({
    map: autotest.map, win: autotest.win, wave: autotest.wave, lives: autotest.lives,
    kills: autotest.kills, simTime: autotest.simTime, aiActions: autotest.aiActions,
    towers: autotest.towers.length, cheats: false,
  }));
}

function startAutotest(mapId) {
  if (autotestActive) return;
  autotestActive = true;
  autotest = {
    done: false, win: false, map: mapId, startedAt: performance.now(),
    simTime: 0, wallMs: 0, fps: 0, lives: 0, kills: 0, gold: 0,
    aiActions: 0, aiOn: true, cheats: false, towers: [], logs: [],
  };
  window.__AUTOTEST__ = autotest;
  startGameInternal(mapId, true, 1);
  if (game) game.prep = 2.5;
  const started = performance.now();
  function stepBatch() {
    if (!autotest || autotest.done) return;
    if (!game) {
      finalizeAutotest(false, true);
      return;
    }
    if (game.over) {
      finalizeAutotest(!!game.over.win);
      return;
    }
    for (let i = 0; i < 70 && !autotest.done; i++) {
      simulate(STEP);
      if (!game || game.over) break;
    }
    if (game && game.over) {
      finalizeAutotest(!!game.over.win);
      return;
    }
    if (game && game.t > 900) {
      finalizeAutotest(false, true);
      return;
    }
    if (performance.now() - started > 90000) {
      finalizeAutotest(false, true);
      return;
    }
    setTimeout(stepBatch, 0);
  }
  setTimeout(stepBatch, 30);
}

const perf = {
  frames: 0, renders: 0, simAvg: 0, renderAvg: 0, rafAvg: 0, lastRaf: 0,
};

window.Emberhold = {
  version: '1.0.0',
  get scene() { return scene; },
  maps: MAPS,
  towers: TOWERS,
  enemies: ENEMIES,
  waves: WAVES,
  state() {
    return {
      scene,
      mapId: game ? game.mapId : selectedMap,
      wave: game ? game.wave : 0,
      phase: game ? game.phase : '',
      prep: game ? +game.prep.toFixed(2) : 0,
      waveT: game ? +game.waveT.toFixed(1) : 0,
      gold: game ? Math.floor(game.gold) : 0,
      lives: game ? game.lives : 0,
      kills: game ? game.kills : 0,
      leaks: game ? game.leaks : 0,
      enemies: game ? game.enemies.filter(e => e.alive).length : 0,
      queued: game ? game.spawnQueue.length : 0,
      projectiles: game ? game.projectiles.length : 0,
      inRange: game ? game.enemies.filter(e => e.alive && game.towers.some(t =>
        t.type !== 'mint' && dist(t.x, t.y, e.x, e.y) <= towerRange(t))).length : 0,
      towers: game ? game.towers.map(t => ({ type: t.type, level: t.level, cx: t.cx, cy: t.cy })) : [],
      aiOn,
      speed: gameSpeed,
      skillCd: game ? +game.skillCd.toFixed(2) : 0,
      aiActions: game ? game.aiActions : 0,
      logs: game ? game.aiLogs.slice(-6) : [],
      fps: Math.round(fpsValue),
      over: game ? game.over : null,
      boss: game && game.boss && game.boss.alive
        ? { hp: Math.ceil(game.boss.hp), maxHp: game.boss.maxHp, x: Math.round(game.boss.x), y: Math.round(game.boss.y) }
        : null,
      transition: transition.active,
      frozen: captureFreeze,
      canvas: { width: canvas.style.width, height: canvas.style.height },
      perf: {
        frames: perf.frames, renders: perf.renders,
        simMs: +perf.simAvg.toFixed(3), renderMs: +perf.renderAvg.toFixed(3),
        rafMs: +perf.rafAvg.toFixed(2),
      },
    };
  },
  startGame(opts = {}) {
    const mapId = opts.mapId || selectedMap;
    const ai = opts.ai !== false;
    const speed = clamp(opts.speed || 1, 1, 3);
    if (opts.instant) {
      startGameInternal(mapId, ai, speed);
      return true;
    }
    beginTransition(() => startGameInternal(mapId, ai, speed));
    return true;
  },
  selectMap(id) { chooseMap(id); },
  startAutotest(mapId = 'ashen') { startAutotest(mapId); },
  toggleAI(force) { toggleAI(force); },
  setSpeed(n) { setSpeed(n); },
  pause(force) { togglePause(force); },
  restart() { restartRun(); },
  switchMap() { switchMapInGame(); },
  menu() { backToMenu(); },
  fastForward(seconds = 10) {
    if (!game || autotestActive || transition.active || scene === 'over') return false;
    const steps = clamp(Math.round(seconds * 60), 0, 1800);
    for (let i = 0; i < steps && !game.over; i++) simulate(STEP);
    render();
    return true;
  },
  freeze(on = true) { captureFreeze = !!on; return captureFreeze; },
  renderOnce() { render(); },
  holdTransition(progress = 0.5) {
    if (!transition.active) return false;
    transitionHeld = true;
    transition.t = clamp(progress, 0, 0.99) * transition.dur;
    render();
    return true;
  },
  finishTransition() {
    if (!transition.active) return false;
    transitionHeld = false;
    transition.active = false;
    transition.old = null;
    render();
    return true;
  },
  build(type, cx, cy) { return tryBuild(type, cx, cy, false, 'API 建造'); },
  upgrade() { return selectedTower ? tryUpgrade(selectedTower, false, 'API 升级') : false; },
  sell() { return selectedTower ? trySell(selectedTower) : false; },
  castSkill() { return castSkill(false); },
  getAutotest() { return window.__AUTOTEST__; },
  benchmark(frames = 90) {
    const n = clamp(Math.round(frames), 1, 300);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) render();
    const ms = (performance.now() - t0) / n;
    return { frames: n, msPerFrame: +ms.toFixed(2), fps: +(1000 / ms).toFixed(1) };
  },
  _bgDataURL(mapId = 'ashen') { return ensureBg(mapId).toDataURL(); },
  _canvasDataURL() { return canvas.toDataURL(); },
};

// 预烘焙两张地图，避免换图卡顿
ensureBg('ashen');
ensureBg('frost');

const params = new URLSearchParams(location.search);
if (params.get('autotest') === '1') {
  const mapId = params.get('map') === 'frost' ? 'frost' : 'ashen';
  startAutotest(mapId);
}

let lastFrameTime = performance.now();
let renderAccumulator = 0;

function frame(now) {
  const frameStart = performance.now();
  perf.frames++;
  if (perf.lastRaf) perf.rafAvg = perf.rafAvg * 0.92 + (now - perf.lastRaf) * 0.08;
  perf.lastRaf = now;
  const dt = Math.min(0.12, Math.max(0, (now - lastFrameTime) / 1000));
  lastFrameTime = now;
  realTime += dt;

  updateTransition(dt);
  if (toast.t > 0) toast.t -= dt;
  if (skillFlash > 0) skillFlash = Math.max(0, skillFlash - dt * 2.2);
  if (lifeFlash > 0) lifeFlash = Math.max(0, lifeFlash - dt * 1.8);

  if (game && game.speed !== gameSpeed) game.speed = gameSpeed;

  if (!autotestActive && !captureFreeze && scene === 'playing' && !transition.active) {
    loopAccum += dt * gameSpeed;
    let steps = 0;
    while (loopAccum >= STEP && steps < 40) {
      simulate(STEP);
      loopAccum -= STEP;
      steps++;
      if (!game || game.over) { loopAccum = 0; break; }
    }
    if (steps >= 40) loopAccum = Math.min(loopAccum, STEP);
  } else if (scene !== 'playing' || transition.active) {
    loopAccum = 0;
  }

  const simEnd = performance.now();
  perf.simAvg = perf.simAvg * 0.92 + (simEnd - frameStart) * 0.08;
  // 目标 60 FPS：用时间积分稳定节流，不依赖高刷/无头环境的无限帧
  renderAccumulator = Math.min(renderAccumulator + dt, 0.12);
  if (renderAccumulator >= 1 / 60 || fpsSamples.length === 0) {
    renderAccumulator = Math.max(0, renderAccumulator - 1 / 60);
    const renderStart = performance.now();
    render();
    perf.renders++;
    perf.renderAvg = perf.renderAvg * 0.92 + (performance.now() - renderStart) * 0.08;
    fpsSamples.push(now);
    if (fpsSamples.length > 40) fpsSamples.shift();
    if (fpsSamples.length > 4) {
      const span = (fpsSamples[fpsSamples.length - 1] - fpsSamples[0]) / 1000;
      if (span > 0.05) fpsValue = (fpsSamples.length - 1) / span;
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    lastFrameTime = performance.now();
    loopAccum = 0;
  }
});

requestAnimationFrame(frame);
})();
</script>
