  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity="0.35">
    <circle cx="1430" cy="120" r="260" fill="#e8b45a" opacity="0.06"/>
    <circle cx="220" cy="880" r="300" fill="#54c7b8" opacity="0.05"/>
