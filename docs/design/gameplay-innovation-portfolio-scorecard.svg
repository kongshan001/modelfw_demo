<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">玩法创新 Portfolio 样片 · 30 seeds / top 3 / 五项评分</title>
  <desc id="desc">T-20261121-034 评分一览：30 个 idea seeds 覆盖卡牌战棋、搜打撤、3D 动作；top 3 为 A1 地形即手牌 19 分、B2 背包即护甲 19 分、C1 灯是武器 18 分；均走 fast track L1，待 T-035 红队独立评审。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#111823"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#c98f35"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73e0cf"/>
      <stop offset="1" stop-color="#2c9c90"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 42px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#eef3fa}
      .sub{font:400 17px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#93a1b5}
      .h2{font:700 20px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#eef3fa}
      .h3{font:600 16px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#dbe5f1}
      .body{font:400 14px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#aebccd}
      .small{font:400 12px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#8594a8}
      .mono{font:600 13px "SFMono-Regular",Consolas,monospace;fill:#c7d3e2}
      .gold{fill:#e8b45a}
      .teal{fill:#54c7b8}
      .warn{fill:#e06c75}
      .panel{fill:#141b26;stroke:#263243;stroke-width:1}
      .card{fill:#18212e;stroke:#2c3a4d;stroke-width:1}
      .divider{stroke:#263243;stroke-width:1}
      .node{fill:#18212e;stroke:#324359;stroke-width:1}
      .arrow{stroke:#4b5f78;stroke-width:2;fill:none}
    </style>
