<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">雾港余烬 · 玩法创新迭代评分与 top 2 brief</title>
  <desc id="desc">T-20261121-042：16 个方案 / 13 个家族；top 1 H1 大件手持 22 分，top 2 N1 搜声 19 分；提案，待独立红队与真人 playtest，未改代码，未自我批准。</desc>
