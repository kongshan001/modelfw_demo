  <!-- Top 1 card -->
  <g transform="translate(1190,194)">
    <rect x="0" y="0" width="690" height="356" rx="10" class="card"/>
    <rect x="0" y="0" width="8" height="356" rx="4" class="goldbar"/>
    <text x="26" y="36" class="h2">TOP 1 · H1 大件手持</text>
    <g transform="translate(584,16)">
      <rect x="0" y="0" width="82" height="58" rx="8" fill="#241d12" stroke="#6b5426"/>
      <text x="41" y="30" text-anchor="middle" class="h2 gold">22</text>
      <text x="41" y="47" text-anchor="middle" class="small">/ 25</text>
    </g>
    <text x="26" y="70" class="body">What if：大件可以扛手省 2–4 格，但占双手、不能射击/冲刺？</text>
    <text x="26" y="94" class="body">玩家放弃：省格 <tspan class="muted">vs</tspan> 火力/机动；不能既满载又保持战斗准备。</text>
    <text x="26" y="124" class="h3">核心循环</text>
    <text x="26" y="146" class="small">30 秒：看到黑匣子 → 装包（4 格）或扛起（省 4 格，收起枪）→ 敌人出现 → 放下 → 射击 → 重拾。</text>
    <text x="26" y="166" class="small">5 分钟：先清精英再扛，还是扛着穿过最后一段；撤离前决定带哪件。</text>
    <text x="26" y="186" class="small">30 分钟：仓库/升级不变；变化的是每局“带什么/怎么带”的风险。</text>
    <text x="26" y="216" class="h3">最小原型 / 验收</text>
    <text x="26" y="238" class="small">L1 5–7 天 · 复用 6×4 背包/拾取/射击/冲刺/HUD · 不做新枪/敌人/地图/美术。</text>
    <text x="26" y="258" class="small">H1 ≥4/5 在 ≥2 个独立时刻扛/放；H2 ≥3/5 说得出取舍；H3 ≥3/5 想再来。</text>
    <text x="26" y="278" class="small">H4 首操作 ≤60 秒；0/5 不知道“不能开枪”；性能回退 ≤10%。</text>
    <text x="26" y="308" class="h3">Kill</text>
    <text x="26" y="330" class="small warn">0/5 扛起；4/5 说“只是多 4 格”；敌人出现时从不放下；UI 不可读；7 天做不出。</text>
    <text x="520" y="330" class="small gold">提案 · 待红队/playtest</text>
  </g>

  <!-- Top 2 card -->
  <g transform="translate(1190,570)">
    <rect x="0" y="0" width="690" height="356" rx="10" class="card"/>
    <rect x="0" y="0" width="8" height="356" rx="4" class="tealbar"/>
    <text x="26" y="36" class="h2">TOP 2 · N1 搜声</text>
    <g transform="translate(584,16)">
      <rect x="0" y="0" width="82" height="58" rx="8" fill="#102622" stroke="#2c6b62"/>
      <text x="41" y="30" text-anchor="middle" class="h2 teal">19</text>
      <text x="41" y="47" text-anchor="middle" class="small">/ 25</text>
    </g>
    <text x="26" y="70" class="body">What if：快搜 0.9 秒大铃声 / 静搜 2.4 秒小铃声；敌人循声查看？</text>
    <text x="26" y="94" class="body">玩家放弃：时间 <tspan class="muted">vs</tspan> 安全；不能又快又安静。</text>
    <text x="26" y="124" class="h3">核心循环</text>
    <text x="26" y="146" class="small">30 秒：靠近箱 → 快搜/静搜 → 铃声扩散 → 敌人转身/走来 → 躲/打/放弃。</text>
    <text x="26" y="166" class="small">5 分钟：规划先搜哪个箱、在哪个巡逻间隙搜、要不要用枪声/冲刺诱敌。</text>
    <text x="26" y="186" class="small">30 分钟：仓库/升级不变；变化的是每局搜索路线和“什么时候值得冒险搜”。</text>
    <text x="26" y="216" class="h3">最小原型 / 验收</text>
    <text x="26" y="238" class="small">先 L0 1 天 → L1 5–7 天 · 复用搜箱计时/敌人 FSM/FX/HUD · 不做音频/新敌人/新地图。</text>
    <text x="26" y="258" class="small">H1 ≥4/5 在 ≥2 次“敌人 350px 内”选择静搜；H2 ≥3/5 说得出；H3 ≥3/5 想再来。</text>
    <text x="26" y="278" class="small">H4 0/5 不知道铃声含义；敌人反应 ≤1.5 秒；卡住 >5 秒 = 0；性能回退 ≤10%。</text>
    <text x="26" y="308" class="h3">Kill</text>
    <text x="26" y="330" class="small warn">4/5 永远快搜；敌人不查看/卡住；铃声不可读；最优是“先清光再搜”；7 天做不出。</text>
    <text x="520" y="330" class="small teal">提案 · 先 L0 灰盒</text>
  </g>

